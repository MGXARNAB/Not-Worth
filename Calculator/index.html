  <script>
    const {useState,useEffect,useRef}=React,{createRoot}=ReactDOM,html=htm.bind(React.createElement);

    const Logo=()=>html`<svg className="brandmark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="currentColor" fillOpacity=".07" stroke="currentColor" strokeOpacity=".5"/><path d="M10 8h12l-8 8 8 8H10" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>`;

    // Membership tiers with FUP limits: basic=10, pro=1000, elite=10000
    const TIERS=[
      {id:'basic',name:'Bare Minimum',price:4.99,limit:10,tagline:'For the casual number enjoyer.',features:['10 calculations per cycle','All four operations','A sense of belonging']},
      {id:'pro',name:'Number Enthusiast',price:12.99,limit:1000,tagline:'For people with spreadsheets.',features:['1,000 calculations per cycle','Priority access to zero','Premium buyer\u2019s remorse'],popular:true},
      {id:'elite',name:'Math Overlord',price:49.99,limit:10000,tagline:'You have more money than problems.',features:['10,000 calculations per cycle','Emotionally supportive \u03C0','A very expensive title']}
    ];
    const FREE_LIMIT = 3;
    const PROCESS_MESSAGES=['Consulting the council of integers\u2026','Adding a fee for calculating the fees\u2026','Convincing your wallet this is self-care\u2026','Moving decimal points to offshore accounts\u2026','Teaching our AI to count to three\u2026','Monetizing your remaining brain cells\u2026','Asking your bank to suspend disbelief\u2026','Turning basic math into recurring revenue\u2026'];
    const ROASTS=['You just subscribed to something your fingers do for free. Evolution is taking notes.','Your phone came with a calculator. We admire your commitment to ignoring that.','You did the math on this purchase. Unfortunately, it was your fourth calculation.','Some people invest in their future. You invested in a plus sign.','Financial literacy called. It would like to unsubscribe from you.'];
    const money=n=>'$'+n.toFixed(2);
    const pretty=s=>String(s).replace(/\*/g,'\u00D7').replace(/\//g,'\u00F7').replace(/-/g,'\u2212');
    const fmtLimit=n=>n>=1000?(n/1000)+'k':String(n);

    // Recursive descent: standard precedence, unary signs, parentheses and postfix percent. No eval.
    function calculate(source){
      const tokens=source.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[()+*/%-]/gi)||[];
      if(tokens.join('')!==source.replace(/\s/g,'')||!tokens.length)throw new Error('Check your expression');
      let i=0;
      function atom(){let value;const t=tokens[i++];if(t==='+')return atom();if(t==='-')return -atom();if(t==='('){value=add();if(tokens[i++]!==')')throw new Error('Close your parentheses');}else{if(!t||!/^\d|^\.\d/.test(t))throw new Error('Finish your expression');value=Number(t);}while(tokens[i]==='%'){i++;value/=100;}return value;}
      function multiply(){let v=atom();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],r=atom();if(op==='/'&&r===0)throw new Error('Cannot divide by zero');v=op==='*'?v*r:v/r;}return v;}
      function add(){let v=multiply();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],r=multiply();v=op==='+'?v+r:v-r;}return v;}
      const result=add();if(i!==tokens.length)throw new Error('Check your expression');if(!Number.isFinite(result))throw new Error('That number is too big');return String(Number(result.toPrecision(12)));
    }
    function validateCard(form){
      const errors={};
      const nm=form.name.trim();
      if(!/^[A-Za-z][A-Za-z.'-]*(?: [A-Za-z.'-]+)+$/.test(nm))errors.name='Enter a first and last name, letters only.';
      else if(nm.length<4)errors.name='That name is too short.';
      const cd=form.card.replace(/ /g,'');
      if(!/^\d{16}$/.test(cd))errors.card='Enter all 16 digits.';
      else if(!/^[45]/.test(cd))errors.card='Card must start with 4 (Visa) or 5 (Mastercard).';
      else if(/^(\d)\1{15}$/.test(cd))errors.card='That is not a real card number.';
      else if(/^(?:0123|1234|2345|3456|4567|5678|6789)/.test(cd))errors.card='Sequential digits are not a card number.';
      const match=form.expiry.match(/^(\d{2})\s*\/\s*(\d{2})$/);
      if(!match||Number(match[1])<1||Number(match[1])>12)errors.expiry='Use MM / YY.';
      else{const ex=new Date(2000+Number(match[2]),Number(match[1]),1),nw=new Date();if(ex<=nw)errors.expiry='Card is expired.';else if(ex>new Date(nw.getFullYear()+10,nw.getMonth(),1))errors.expiry='Expiry too far ahead.';}
      if(!/^\d{3}$/.test(form.cvc))errors.cvc='Enter 3 digits.';else if(/^(\d)\1{2}$/.test(form.cvc))errors.cvc='Enter a valid CVV.';
      return errors;
    }
    function Dialog({children,onClose,narrow=false,label}){

      return html`<div className="modal-backdrop" onClick=${e=>{if(e.target===e.currentTarget)onClose();}}><section ref=${ref} className=${'modal'+(narrow?' narrow':'')} role="dialog" aria-modal="true" aria-label=${label} tabIndex="-1"><button className="close-button" aria-label="Close dialog" onClick=${onClose}><${Icon} name="close" size=${15}/></button>${children}</section></div>`;
    }
    function Steps({stage}){return html`<div className="steps">${['Plan','Details','Processing','Receipt'].map((name,i)=>html`<${React.Fragment} key=${name}>${i>0&&html`<span className="step-line"></span>`}<div className=${'step'+(i===stage?' active':i<stage?' done':'')} aria-current=${i===stage?'step':undefined}><span className="step-num">${i<stage?html`<${Icon} name="check" size=${10}/>`:i+1}</span><span>${name.toUpperCase()}</span></div></${React.Fragment}>`)}</div>`;}
    const RANK={free:-1,basic:0,pro:1,elite:2};
    const UPGRADE_DISCOUNT=0.25;
    const upgradePrice=(plan,current)=>current&&RANK[current.id]>=0?Math.max(0,Number((plan.price-current.price-((plan.price-current.price)*UPGRADE_DISCOUNT)).toFixed(2))):plan.price;

    // ---------- PNG export: receipt & certificate are rasterized on <canvas> (universally supported) ----------
    const FONT_SANS='"DM Sans",Arial,sans-serif',FONT_MONO='"IBM Plex Mono","Courier New",monospace',FONT_SERIF='Georgia,"Times New Roman",serif',GREEN='#c1f58b';
    function setupCanvas(w,h){const scale=2,c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const ctx=c.getContext('2d');ctx.scale(scale,scale);return[c,ctx];}
    function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
    function txt(ctx,text,x,y,font,color,align){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.fillText(text,x,y);ctx.textAlign='left';}
    function spaced(ctx,text,x,y,font,color,spacing,align){ctx.save();ctx.font=font;ctx.fillStyle=color;ctx.textAlign='left';const chars=[...text],widths=chars.map(ch=>ctx.measureText(ch).width),total=widths.reduce((a,b)=>a+b,0)+spacing*Math.max(0,chars.length-1);let cx=align==='right'?x-total:align==='center'?x-total/2:x;for(let i=0;i<chars.length;i++){ctx.fillText(chars[i],cx,y);cx+=widths[i]+spacing;}ctx.restore();}
    function fitDraw(ctx,text,o){const build=s=>(o.style?o.style+' ':'')+(o.weight?o.weight+' ':'')+s+'px '+o.family;let s=o.size;ctx.font=build(s);while(ctx.measureText(text).width>o.max&&s>o.minSize)s--;ctx.font=build(s);ctx.fillStyle=o.color;ctx.textAlign=o.align||'left';ctx.fillText(text,o.x,o.y);ctx.textAlign='left';}
    function dashLine(ctx,x1,y1,x2,y2,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
    function ensureFonts(){if(!(document.fonts&&document.fonts.load))return Promise.resolve();return Promise.all(['400 16px "DM Sans"','500 16px "DM Sans"','600 16px "DM Sans"','700 16px "DM Sans"','400 16px "IBM Plex Mono"','500 16px "IBM Plex Mono"'].map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>{});}
    function toPNG(canvas,filename){return new Promise((resolve,reject)=>{canvas.toBlob(blob=>{if(!blob){reject(new Error('PNG export failed'));return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{URL.revokeObjectURL(url);resolve();},300);},'image/png');});}
    function exportReceiptPNG(receipt,tier,lines,total){
      const finalY=355+lines.length*26,H=finalY+160,[canvas,ctx]=setupCanvas(1000,H);
      const bg=ctx.createLinearGradient(0,0,1000,H);bg.addColorStop(0,'#101910');bg.addColorStop(1,'#0a0f0a');ctx.fillStyle=bg;ctx.fillRect(0,0,1000,H);
      ctx.fillStyle='rgba(193,245,139,.06)';for(let y=1;y<H;y+=24)for(let x=1;x<1000;x+=24)ctx.fillRect(x,y,2,2);
      ctx.strokeStyle='rgba(193,245,139,.28)';ctx.lineWidth=2;rr(ctx,28,28,944,H-56,22);ctx.stroke();
      ctx.strokeStyle='rgba(193,245,139,.1)';ctx.lineWidth=1.5;rr(ctx,44,44,912,H-88,16);ctx.stroke();
      txt(ctx,'sum.',80,115,'700 48px '+FONT_SANS,GREEN);
      spaced(ctx,'RECEIPT',920,100,'12px '+FONT_MONO,'#718865',2,'right');
      txt(ctx,receipt.id,920,120,'13px '+FONT_MONO,'#8b9f7d','right');
      txt(ctx,receipt.date,920,140,'13px '+FONT_MONO,'#8b9f7d','right');
      dashLine(ctx,80,170,920,170,'#35472c');
      spaced(ctx,'BILL TO',80,210,'11px '+FONT_MONO,'#6f7d6c',2);
      txt(ctx,receipt.name,80,240,'500 22px '+FONT_SANS,'#e6f6d4');
      txt(ctx,'CARD \u2022\u2022\u2022\u2022 '+receipt.last4+' \u00B7 '+tier.name.toUpperCase(),80,265,'12px '+FONT_MONO,'#8b9f7d');
      spaced(ctx,'AMOUNT',920,210,'11px '+FONT_MONO,'#6f7d6c',2,'right');
      txt(ctx,money(total),920,275,'600 36px '+FONT_SANS,GREEN,'right');
      dashLine(ctx,80,305,920,305,'#35472c');
      spaced(ctx,'ITEM',80,335,'11px '+FONT_MONO,'#6f7d6c',2);
      spaced(ctx,'AMOUNT',920,335,'11px '+FONT_MONO,'#6f7d6c',2,'right');
      lines.forEach((line,i)=>{const y=355+i*26;txt(ctx,line[0],80,y,'13px '+FONT_MONO,'#9db08e');txt(ctx,(line[1]<0?'\u2212':'')+money(Math.abs(line[1])),920,y,'13px '+FONT_MONO,'#c4d7b5','right');});
      dashLine(ctx,80,finalY,920,finalY,'#35472c');
      txt(ctx,'TOTAL CHARGED',80,finalY+35,'600 18px '+FONT_SANS,'#dbeccf');
      txt(ctx,money(total),920,finalY+40,'700 28px '+FONT_SANS,GREEN,'right');
      fitDraw(ctx,'\u201C'+receipt.roast+'\u201D',{style:'italic',size:14,minSize:10,family:FONT_SERIF,color:'#adc599',x:80,y:finalY+85,max:640});
      ctx.strokeStyle='rgba(163,207,116,.35)';ctx.lineWidth=1.5;rr(ctx,750,finalY+70,160,56,6);ctx.stroke();
      txt(ctx,'sum.',830,finalY+95,'italic 18px '+FONT_SERIF,GREEN,'center');
      spaced(ctx,'PAID',830,finalY+115,'8px '+FONT_MONO,'#6f7d6c',1,'center');
      return toPNG(canvas,receipt.id+'-receipt.png');
    }
    function exportCertificatePNG(receipt,tier,price){
      const [canvas,ctx]=setupCanvas(1000,700);
      const bg=ctx.createLinearGradient(0,0,1000,700);bg.addColorStop(0,'#101713');bg.addColorStop(1,'#0b0f0d');ctx.fillStyle=bg;ctx.fillRect(0,0,1000,700);
      ctx.strokeStyle='rgba(193,245,139,.35)';ctx.lineWidth=2;rr(ctx,26,26,948,648,34);ctx.stroke();
      ctx.strokeStyle='rgba(193,245,139,.12)';ctx.lineWidth=1.5;rr(ctx,42,42,916,616,26);ctx.stroke();
      spaced(ctx,'CERTIFICATE OF QUESTIONABLE SPENDING',500,120,'15px '+FONT_MONO,'#8b9a83',7,'center');
      txt(ctx,'This certifies that',500,215,'54px '+FONT_SERIF,'#f0f3f0','center');
      fitDraw(ctx,receipt.name,{style:'italic',size:66,minSize:30,family:FONT_SERIF,color:GREEN,x:500,y:300,max:860,align:'center'});
      ctx.strokeStyle='rgba(193,245,139,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(270,330);ctx.lineTo(730,330);ctx.stroke();
      txt(ctx,'paid real-looking money for the ancient art of',500,390,'27px '+FONT_SERIF,'#b9c5b0','center');
      txt(ctx,'ADDING NUMBERS TOGETHER',500,440,'40px '+FONT_SERIF,'#e6f6d4','center');
      fitDraw(ctx,'TIER: '+tier.name.toUpperCase()+' \u00B7 '+money(price)+'/MO \u00B7 CARD \u2022\u2022\u2022\u2022 '+receipt.last4+' \u00B7 '+fmtLimit(tier.limit)+' CALCULATIONS',{size:16,minSize:11,family:FONT_MONO,color:'#8b9a83',x:500,y:492,max:880,align:'center'});
      fitDraw(ctx,'\u201C'+receipt.roast+'\u201D',{style:'italic',size:19,minSize:12,family:FONT_SERIF,color:'#7b8a76',x:500,y:545,max:860,align:'center'});
      txt(ctx,receipt.id,120,625,'13px '+FONT_MONO,'#6f7d6c');
      txt(ctx,receipt.date,120,648,'13px '+FONT_MONO,'#6f7d6c');
      ctx.strokeStyle='rgba(193,245,139,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(770,628);ctx.lineTo(990,628);ctx.stroke();

      spaced(ctx,'CHIEF NUMBER OFFICER',880,648,'11px '+FONT_MONO,'#6f7d6c',1,'center');
      return toPNG(canvas,receipt.id+'-certificate.png');
    }


    function Checkout({locked,current,onClose,onComplete}){
      const available=TIERS.filter(p=>!current||RANK[p.id]>RANK[current.id]);
      const maxed=!!current&&available.length===0;
      const [stage,setStage]=useState(0),[tier,setTier]=useState(available[0]||TIERS[TIERS.length-1]);
      const price=upgradePrice(tier,current);
      const [form,setForm]=useState({name:'',card:'',expiry:'',cvc:''}),[errors,setErrors]=useState({});
      const [progress,setProgress]=useState(0),[message,setMessage]=useState(''),[receipt,setReceipt]=useState(null),[downloadedBill,setDownloadedBill]=useState(false),[certified,setCertified]=useState(false);
      useEffect(()=>{const dialog=document.querySelector('.modal');dialog?.scrollTo({top:0,behavior:'smooth'});dialog?.focus({preventScroll:true});},[stage]);
      useEffect(()=>{if(stage!==2)return;let count=0,finishTimer;const shuffled=[...PROCESS_MESSAGES];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}setMessage(shuffled[0]);setProgress(8);const id=setInterval(()=>{count++;setProgress(Math.min(100,8+count*18.4));setMessage(shuffled[count%shuffled.length]);if(count>=5){clearInterval(id);finishTimer=setTimeout(()=>setStage(3),350);}},1150);return()=>{clearInterval(id);clearTimeout(finishTimer);};},[stage]);
      const change=(key,value)=>{setForm(f=>({...f,[key]:value}));if(errors[key])setErrors(e=>({...e,[key]:undefined}));};

      const submit=e=>{e.preventDefault();const errs=validateCard(form);setErrors(errs);if(Object.keys(errs).length){requestAnimationFrame(()=>document.getElementById('field-'+Object.keys(errs)[0])?.focus());return;}setReceipt({id:'SUM-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16).slice(0,8).toUpperCase(),date:new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}),name:form.name.trim(),last4:form.card.replace(/\s/g,'').slice(-4),roast:ROASTS[Math.floor(Math.random()*ROASTS.length)]});setForm(f=>({...f,card:'',cvc:'',expiry:''}));setStage(2);};
      const lines=[['The '+tier.name+' experience',tier.price],...(current?[['Credit for '+current.name,-current.price],['Upgrade discount (25%)',-Number(((tier.price-current.price)*UPGRADE_DISCOUNT).toFixed(2))]]:[]),['Convenience of pressing \u201C=\u201D',2.49],['Artificial intelligence (a for-loop)',1.99],['Emotional processing fee',.99]];
      const total=Number(lines.reduce((a,[,v])=>a+v,0).toFixed(2));

      // Receipt & certificate download as PNG (rasterized on canvas)
      const downloadBill=()=>{ensureFonts().then(()=>exportReceiptPNG(receipt,tier,lines,total)).then(()=>setDownloadedBill(true)).catch(()=>{});};
      const certificate=()=>{ensureFonts().then(()=>exportCertificatePNG(receipt,tier,price)).then(()=>setCertified(true)).catch(()=>{});};
      const field=(key,label,placeholder,extra={})=>html`<div className="field"><label htmlFor=${'field-'+key}>${label}</label><div className=${key==='card'?'input-icon-wrap':''}><input id=${'field-'+key} className=${errors[key]?'invalid':''} value=${form[key]} placeholder=${placeholder} autoComplete="off" aria-invalid=${!!errors[key]} aria-describedby=${errors[key]?'error-'+key:undefined} ...${extra} onChange=${e=>{let value=e.target.value;if(key==='name')value=value.replace(/[^A-Za-z .'-]/g,'').replace(/ {2,}/g,' ').slice(0,60);if(key==='card')value=value.replace(/\D/g,'').slice(0,16).replace(/(.{4})(?=.)/g,'$1 ');if(key==='expiry'){let digits=value.replace(/\D/g,'').slice(0,4);value=digits.length>2?digits.slice(0,2)+' / '+digits.slice(2):digits;}if(key==='cvc')value=value.replace(/\D/g,'').slice(0,3);change(key,value);}}/>${key==='card'&&html`<${Icon} name="card" size=${17}/>`}</div>${errors[key]&&html`<span id=${'error-'+key} className="error-message">${errors[key]}</span>`}</div>`;
      return html`<${Dialog} onClose=${stage===3?()=>{if(certified)onComplete(tier);}:onClose} narrow=${stage!==0} label="Checkout"><${Steps} stage=${stage}/>
        ${stage===0&&maxed&&html`<div className="modal-intro"><div className="modal-icon"><${Icon} name="sparkle" size=${21}/></div><h2>You\u2019re already at the top.</h2><p className="modal-description">${current.name} is the highest plan. You have ${fmtLimit(current.limit)} calculations per cycle and our sincere concern.</p></div><div className="modal-action"><button className="primary" onClick=${onClose}>Back to calculating <${Icon} name="arrow" size=${16}/></button></div>`}
        ${stage===0&&!maxed&&html`<div className="modal-intro"><div className="modal-icon"><${Icon} name=${locked?'lock':'sparkle'} size=${21}/></div><h2>${current?'Upgrade your plan.':locked?'You\u2019ve reached your limit.':'A little more possibility.'}</h2><p className="modal-description">${current?'You\u2019re on '+current.name+'. Upgrades are discounted 25% and credit what you already paid.':'Choose your plan and keep calculating.'}</p></div><div className="plans">${available.map(p=>html`<button key=${p.id} className=${'plan'+(tier.id===p.id?' selected':'')} aria-pressed=${tier.id===p.id} onClick=${()=>setTier(p)}>${p.popular&&html`<span className="popular">MOST POPULAR</span>`}<span className="plan-radio"></span><span className="plan-name">${p.name}</span><span className="plan-tagline">${p.tagline}</span><div className="plan-price">${money(upgradePrice(p,current))}<span> / mo</span></div>${current&&html`<span className="plan-tagline" style=${{textDecoration:'line-through',opacity:.6}}>${money(p.price)}</span>`}<ul className="plan-features">${p.features.map(f=>html`<li key=${f}><${Icon} name="check" size=${12}/>${f}</li>`)}</ul></button>`)}</div><div className="modal-action"><button className="primary" onClick=${()=>setStage(1)}>${current?'Upgrade to ':'Continue with '}${tier.name} <${Icon} name="arrow" size=${16}/></button></div>`}
        ${stage===1&&html`<div className="modal-intro"><h2>Complete your upgrade.</h2><p className="modal-description">One step closer to more.</p></div><div className="checkout-summary"><div><strong>${tier.name}</strong><br/><span>${money(price)} / month${current?' \u00B7 upgrade price':''} \u00B7 ${fmtLimit(tier.limit)} calcs</span></div><button onClick=${()=>setStage(0)}>Change plan</button></div><form onSubmit=${submit} noValidate autoComplete="off">
          ${field('name','Cardholder name','Jane Doe',{maxLength:60})}
          ${field('card','Card number','4242 4242 4242 4242',{inputMode:'numeric',maxLength:19})}
          <div className="field-row">${field('expiry','Expiry','MM / YY',{inputMode:'numeric',maxLength:7})}${field('cvc','CVC','123',{inputMode:'numeric',maxLength:3,type:'password'})}</div>
          <button className="primary" type="submit">Confirm upgrade \u00B7 ${money(price)} <${Icon} name="arrow" size=${15}/></button></form>`}
        ${stage===2&&html`<div className="processing"><div className="spinner-orbit"><${Icon} name="bolt" size=${34}/></div><h2>Preparing your upgrade.</h2><div className="processing-message" role="status" aria-live="polite">${message}</div><div className="progress-track" role="progressbar" aria-valuenow=${Math.round(progress)} aria-valuemin="0" aria-valuemax="100" aria-label="Upgrade progress"><div className="progress-fill" style=${{width:progress+'%'}}></div></div><div className="processing-meta"><span>PROCESSING</span><span>${Math.round(progress)}%</span></div></div>`}
        ${stage===3&&receipt&&html`<div className="modal-intro"><div className="modal-icon"><${Icon} name="check" size=${23}/></div><h2>You\u2019re all set.</h2><p className="modal-description">Your calculator is upgraded. Your judgment is under review.</p></div><div className="receipt"><div className="receipt-head"><div><div className="wordmark">sum.</div><span className="receipt-stamp"><${Icon} name="check" size=${10}/> COMPLETE</span></div><div className="receipt-id">${receipt.id}<br/>${receipt.date}</div></div><div className="receipt-customer">${receipt.name}<br/>CARD: \u2022\u2022\u2022\u2022 ${receipt.last4}</div>${lines.map(([label,value])=>html`<div className="receipt-line" key=${label}><span>${label}</span><span>${value<0?'\u2212':''}${money(Math.abs(value))}</span></div>`)}<div className="receipt-line total"><span>Total charged</span><span>${money(total)}</span></div><p className="roast">\u201C${receipt.roast}\u201D</p></div><div className="receipt-actions"><button className="secondary" onClick=${downloadBill}><${Icon} name=${downloadedBill?'check':'receipt'} size=${14}/>${downloadedBill?'Receipt saved':'Download receipt'}</button><button className="secondary" onClick=${certificate}><${Icon} name=${certified?'check':'download'} size=${14}/>${certified?'Certificate saved':'Download certificate'}</button><button className="primary" disabled=${!certified} onClick=${()=>onComplete(tier)}>${certified?'Continue':'Download certificate to continue'} <${Icon} name="arrow" size=${15}/></button></div>${!certified&&html`<span className="mandatory-hint">Certificate download is required</span>`}`}
      </${Dialog}>`;
    }
    const KEY_LAYOUT=[['AC','clear','utility','Clear all'],['+/−','sign','utility','Toggle sign'],['%','%','utility','Percent'],['÷','/','operator','Divide'],['7','7','','Seven'],['8','8','','Eight'],['9','9','','Nine'],['×','*','operator','Multiply'],['4','4','','Four'],['5','5','','Five'],['6','6','','Six'],['−','-','operator','Subtract'],['1','1','','One'],['2','2','','Two'],['3','3','','Three'],['+','+','operator','Add'],['0','0','zero','Zero'],['.','.','','Decimal point'],['=','=','equal','Equals']];

    function App(){
      // Removed the disclaimer/gate entirely - app starts directly
      const [expression,setExpression]=useState('0'),[lastExpression,setLastExpression]=useState(''),[finished,setFinished]=useState(false),[error,setError]=useState('');
      const [uses,setUses]=useState(0),[paid,setPaid]=useState(null),[extraUsed,setExtraUsed]=useState(0),[modal,setModal]=useState(null),[history,setHistory]=useState([]),[showHistory,setShowHistory]=useState(false),[pressed,setPressed]=useState(null),[toast,setToast]=useState('');
      const limit=paid?paid.limit:FREE_LIMIT;
      const used=paid?extraUsed:uses;
      const remaining=Math.max(0,limit-used);
      const locked=remaining===0;
      const modalRef=useRef(modal);modalRef.current=modal;
      const closeModal=React.useCallback(()=>setModal(null),[]);
      useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),3500);return()=>clearTimeout(t);},[toast]);
      useEffect(()=>{if(!pressed)return;const t=setTimeout(()=>setPressed(null),110);return()=>clearTimeout(t);},[pressed]);
      function input(value){
        if(modalRef.current)return;
        if(locked){setModal('checkout');return;}
        setPressed(value);
        if(value==='clear'){setExpression('0');setLastExpression('');setError('');setFinished(false);return;}
        if(value==='backspace'){setExpression(expression.length>1?expression.slice(0,-1):'0');setError('');setFinished(false);return;}
        if(value==='='){
          if(finished&&!error)return;
          try{const result=calculate(expression);setLastExpression(pretty(expression)+' =');setExpression(result);setFinished(true);setError('');setHistory(h=>[{expression:pretty(expression),result:pretty(result),id:Date.now()},...h].slice(0,10));if(paid)setExtraUsed(n=>n+1);else setUses(n=>n+1);if(remaining===1)setModal('checkout');}
          catch(e){setError(e.message);}
          return;
        }
        setError('');
        if(value==='sign'){
          try{if(finished){setExpression(String(-Number(expression)));}else{const match=expression.match(/(\d*\.?\d+(?:e[+-]?\d+)?%?)$/i);if(match){const start=match.index;const prefix=expression.slice(0,start);setExpression(prefix+'(-'+match[0]+')');}else if(expression.endsWith(')'))setExpression('-('+expression+')');else setExpression(expression==='0'?'-':expression+'-');}}catch{setExpression('0');}setFinished(false);return;
        }
        let current=expression;
        if(finished){if(/[0-9.(]/.test(value)){current='0';setLastExpression('');}setFinished(false);}
        if(current.length>=64){setToast('64 characters. Even our generosity has limits.');return;}
        if(/^\d$/.test(value)){setExpression(current==='0'?value:current.endsWith(')')||current.endsWith('%')?current+'*'+value:current+value);return;}
        if(value==='.') {const segment=current.split(/[+\-*/()]/).pop();if(segment.includes('.')||segment.includes('e')||current.endsWith('%'))return;setExpression(current+(segment===''?'0.':'.'));return;}
        if(['+','-','*','/'].includes(value)){if(/[+*/-]$/.test(current)){if(value==='-'&&!current.endsWith('-'))setExpression(current+'-');else setExpression(current.replace(/[+*/-]+$/,value));}else setExpression(current+value);return;}
        if(value==='%'){if(/[\d)]$/.test(current))setExpression(current+'%');return;}
        if(value==='('){setExpression(current==='0'?'(':current+(/[\d)%]$/.test(current)?'*(':'('));return;}
        if(value===')'){const opens=(current.match(/\(/g)||[]).length,closes=(current.match(/\)/g)||[]).length;if(opens>closes&&/[\d)%]$/.test(current))setExpression(current+')');}
      }
      const inputRef=useRef(input);inputRef.current=input;
      useEffect(()=>{const handle=e=>{if(modalRef.current||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.target.tagName==='BUTTON'&&(e.key===' '||(e.key==='Enter'&&!e.target.closest('.keypad'))))return;let key=e.key;if(key==='Enter'||key==='=')key='=';else if(key==='Escape'||key==='Delete'||key.toLowerCase()==='c')key='clear';else if(key==='Backspace')key='backspace';else if(key.toLowerCase()==='x')key='*';else if(!/^[0-9.+\-*/%()]$/.test(key))return;e.preventDefault();inputRef.current(key);};window.addEventListener('keydown',handle);return()=>window.removeEventListener('keydown',handle);},[]);
      const complete=tier=>{if(paid&&RANK[tier.id]<=RANK[paid.id]){setModal(null);setToast('You already have '+paid.name+'.');return;}setPaid(tier);setExtraUsed(0);setModal(null);setToast(fmtLimit(tier.limit)+' calculations unlocked.');};
      const openCheckout=()=>setModal('checkout');
      const pct=Math.round(remaining/limit*100);
      return html`<div className="site"><header><a href="#" className="brand" aria-label="sum. home" onClick=${e=>e.preventDefault()}><${Logo}/><span className="wordmark">sum.</span></a><button className="nav-upgrade" onClick=${openCheckout}>Upgrade</button></header>
      <main>
      <div className="workspace" style=${history.length>0?null:{gridTemplateColumns:'minmax(0,408px)'}}><div className="calculator-wrap"><section className="calculator" id="calculator" aria-label="Calculator" tabIndex="-1"><div className="calc-top"><span className="calc-label"><${Icon} name="calc" size=${13}/> STANDARD</span><div className="plan-meter"><span className="plan-pill"><span className="tiny-dot" style=${{width:'3px',height:'3px'}}></span>${paid?paid.name.toUpperCase():'FREE PLAN'}<b>${remaining}/${limit}</b></span><span className="mini-meter" role="progressbar" aria-label=${remaining+' of '+limit+' remaining'}><i style=${{width:pct+'%'}}></i></span></div></div><div className="display"><div className="display-top"><span>${locked?'LIMIT REACHED':''}</span><span className="history-expr">${lastExpression.length>23?'\u2026'+lastExpression.slice(-22):lastExpression}</span></div><div className=${'display-number'+(expression.length>11?' small':'')+(error?' error':'')} aria-live="polite" aria-atomic="true">${error?html`<span title=${error}>${error.includes('zero')?'Nice try.':error.includes('big')?'Too ambitious.':'Not quite.'}</span>`:pretty(expression)}</div>${error&&html`<span style=${{fontSize:'9px',color:'#c18f7c',display:'block',marginTop:'-4px',marginBottom:'3px'}} role="alert">${error}</span>`}</div><div className="keypad">${KEY_LAYOUT.map(([label,value,cls,aria])=>html`<button key=${value} className=${'key '+cls+(pressed===value?' pressed':'')} onClick=${()=>input(value)} aria-label=${aria} aria-disabled=${locked} title=${locked?'Trial complete \u2014 choose a mock plan':aria}>${label}</button>`)}</div>${locked&&html`<button className="usage-ended" onClick=${openCheckout} style=${{margin:'15px auto 0'}}>Upgrade to continue <${Icon} name="arrow" size=${13}/></button>`}</section></div>
      <aside className="sidebar">${history.length>0&&html`<div className="history-panel"><div className="section-kicker"><button onClick=${()=>setShowHistory(v=>!v)} style=${{display:'flex',alignItems:'center',gap:'6px'}}><${Icon} name="history" size=${12}/> RECENT MATH ${showHistory?'\u2212':'+'}</button>${showHistory&&html`<button onClick=${()=>{setHistory([]);setShowHistory(false);}}>Clear</button>`}</div>${showHistory&&history.map(item=>html`<div className="history-row" key=${item.id}><span>${item.expression.length>25?item.expression.slice(0,25)+'\u2026':item.expression}</span><strong>= ${item.result}</strong></div>`)}</div>`}</aside></div></main>
      <footer><span className="disclaimer">Disclaimer: sum. is a satirical demo \u2014 no real payments are processed, nothing is charged, and every number stays on your device.</span><div className="footer-right"><span className="built">\u00A9 2026 sum. industries \u00B7 all charges imaginary</span></div></footer>
      ${modal==='checkout'&&html`<${Checkout} locked=${locked} current=${paid} onClose=${closeModal} onComplete=${complete}/>`}
      ${toast&&html`<div className="toast" role="status">${toast}</div>`}</div>`;
    }
    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
