      const lines=[['The '+tier.name+' experience',tier.price],...(current?[['Credit for '+current.name,-current.price],['Upgrade discount (25%)',-Number(((tier.price-current.price)*UPGRADE_DISCOUNT).toFixed(2))]]:[]),['Convenience of pressing \u201C=\u201D',2.49],['Artificial intelligence (a for-loop)',1.99],['Emotional processing fee',.99]];

      lines.push(['Reality adjustment',-Number(linesTotal.toFixed(2))]);

      // Graphical receipt (bill) download - SVG like the certificate
      const downloadBill=()=>{
        const svg=buildReceiptSVG(receipt,tier,price,lines);
        const blob=new Blob([svg],{type:'image/svg+xml'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=receipt.id+'-receipt.svg';a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        setDownloadedBill(true);
      };

      const certificate=()=>{
        const svg=buildCertificateSVG(receipt,tier,price);
        const blob=new Blob([svg],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=receipt.id+'-certificate.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);setCertified(true);
      };
      const field=(key,label,placeholder,extra={})=>html`<div className="field"><label htmlFor=${'field-'+key}>${label}</label><div className=${key==='card'?'input-icon-wrap':''}><input id=${'field-'+key} className=${errors[key]?'invalid':''} value=${form[key]} placeholder=${placeholder} autoComplete="off" aria-invalid=${!!errors[key]} aria-describedby=${errors[key]?'error-'+key:undefined} ...${extra} onChange=${e=>{let value=e.target.value;if(key==='name')value=value.replace(/[^A-Za-z .'-]/g,'').replace(/ {2,}/g,' ').slice(0,60);if(key==='card')value=value.replace(/\D/g,'').slice(0,16).replace(/(.{4})(?=.)/g,'$1 ');if(key==='expiry'){let digits=value.replace(/\D/g,'').slice(0,4);value=digits.length>2?digits.slice(0,2)+' / '+digits.slice(2):digits;}if(key==='cvc')value=value.replace(/\D/g,'').slice(0,3);change(key,value);}}/>${key==='card'&&html`<${Icon} name="card" size=${17}/>`}</div>${errors[key]&&html`<span id=${'error-'+key} className="error-message">${errors[key]}</span>`}</div>`;
      return html`<${Dialog} onClose=${stage===3?()=>{if(certified)onComplete(tier);}:onClose} narrow=${stage!==0} label="Checkout"><${Steps} stage=${stage}/>
        ${stage===0&&maxed&&html`<div className="modal-intro"><div className="modal-icon"><${Icon} name="sparkle" size=${21}/></div><h2>You\u2019re already at the top.</h2><p className="modal-description">${current.name} is the highest plan. You have ${fmtLimit(current.limit)} calculations per cycle and our sincere concern.</p></div><div className="modal-action"><button className="primary" onClick=${onClose}>Back to calculating <${Icon} name="arrow" size=${16}/></button></div>`}
        ${stage===0&&!maxed&&html`<div className="modal-intro"><div className="modal-icon"><${Icon} name=${locked?'lock':'sparkle'} size=${21}/></div><h2>${current?'Upgrade your plan.':locked?'You\u2019ve reached your limit.':'A little more possibility.'}</h2><p className="modal-description">${current?'You\u2019re on '+current.name+'. Upgrades are discounted 25% and credit what you already paid.':'Choose your plan and keep calculating.'}</p></div><div className="plans">${available.map(p=>html`<button key=${p.id} className=${'plan'+(tier.id===p.id?' selected':'')} aria-pressed=${tier.id===p.id} onClick=${()=>setTier(p)}>${p.popular&&html`<span className="popular">MOST POPULAR</span>`}<span className="plan-radio"></span><span className="plan-name">${p.name}</span><span className="plan-tagline">${p.tagline}</span><div className="plan-price">${money(upgradePrice(p,current))}<span> / mo</span></div>${current&&html`<span className="plan-tagline" style=${{textDecoration:'line-through',opacity:.6}}>${money(p.price)}</span>`}<ul className="plan-features">${p.features.map(f=>html`<li key=${f}><${Icon} name="check" size=${12}/>${f}</li>`)}</ul></button>`)}</div><div className="modal-action"><button className="primary" onClick=${()=>setStage(1)}>${current?'Upgrade to ':'Continue with '}${tier.name} <${Icon} name="arrow" size=${16}/></button></div>`}
        ${stage===1&&html`<div className="modal-intro"><h2>Complete your upgrade.</h2><p className="modal-description">One step closer to more.</p></div><div className="checkout-summary"><div><strong>${tier.name}</strong><br/><span>${money(price)} / month${current?' \u00B7 upgrade price':''} \u00B7 ${fmtLimit(tier.limit)} calcs</span></div><button onClick=${()=>setStage(0)}>Change plan</button></div><form onSubmit=${submit} noValidate autoComplete="off">
          ${field('name','Cardholder name','Jane Doe',{maxLength:60})}
          ${field('card','Card number','4242 4242 4242 4242',{inputMode:'numeric',maxLength:19})}
          <div className="field-row">${field('expiry','Expiry','MM / YY',{inputMode:'numeric',maxLength:7})}${field('cvc','CVC','123',{inputMode:'numeric',maxLength:3,type:'password'})}</div>
          <button className="primary" type="submit">Confirm upgrade \u00B7 ${money(price)} <${Icon} name="arrow" size=${15}/></button></form>`}
        ${stage===2&&html`<div className="processing"><div className="spinner-orbit"><${Icon} name="bolt" size=${34}/></div><h2>Preparing your upgrade.</h2><div className="processing-message" role="status" aria-live="polite">${message}</div><div className="progress-track" role="progressbar" aria-valuenow=${Math.round(progress)} aria-valuemin="0" aria-valuemax="100" aria-label="Upgrade progress"><div className="progress-fill" style=${{width:progress+'%'}}></div></div><div className="processing-meta"><span>PROCESSING</span><span>${Math.round(progress)}%</span></div></div>`}
        ${stage===3&&receipt&&html`<div className="modal-intro"><div className="modal-icon"><${Icon} name="check" size=${23}/></div><h2>You\u2019re all set.</h2><p className="modal-description">Your calculator is upgraded. Your judgment is under review.</p></div><div className="receipt"><div className="receipt-head"><div><div className="wordmark">sum.</div><span className="receipt-stamp"><${Icon} name="check" size=${10}/> COMPLETE</span></div><div className="receipt-id">${receipt.id}<br/>${receipt.date}</div></div><div className="receipt-customer">${receipt.name}<br/>CARD: \u2022\u2022\u2022\u2022 ${receipt.last4}</div>${lines.map(([label,value])=>html`<div className="receipt-line" key=${label}><span>${label}</span><span>${value<0?'\u2212':''}${money(Math.abs(value))}</span></div>`)}<div className="receipt-line total"><span>Total charged</span><span>$0.00</span></div><p className="roast">\u201C${receipt.roast}\u201D</p></div><div className="receipt-actions"><button className="secondary" onClick=${downloadBill}><${Icon} name=${downloadedBill?'check':'receipt'} size=${14}/>${downloadedBill?'Receipt saved':'Download receipt'}</button><button className="secondary" onClick=${certificate}><${Icon} name=${certified?'check':'download'} size=${14}/>${certified?'Certificate saved':'Download certificate'}</button><button className="primary" disabled=${!certified} onClick=${()=>onComplete(tier)}>${certified?'Continue':'Download certificate to continue'} <${Icon} name="arrow" size=${15}/></button></div>${!certified&&html`<span className="mandatory-hint">Certificate download is required</span>`}`}
      </${Dialog}>`;
    }
    const KEY_LAYOUT=[['AC','clear','utility','Clear all'],['+/−','sign','utility','Toggle sign'],['%','%','utility','Percent'],['÷','/','operator','Divide'],['7','7','','Seven'],['8','8','','Eight'],['9','9','','Nine'],['×','*','operator','Multiply'],['4','4','','Four'],['5','5','','Five'],['6','6','','Six'],['−','-','operator','Subtract'],['1','1','','One'],['2','2','','Two'],['3','3','','Three'],['+','+','operator','Add'],['0','0','zero','Zero'],['.','.','','Decimal point'],['=','=','equal','Equals']];

    function App(){
      // Removed the disclaimer/gate entirely - app starts directly
      const [expression,setExpression]=useState('0'),[lastExpression,setLastExpression]=useState(''),[finished,setFinished]=useState(false),[error,setError]=useState('');
      const [uses,setUses]=useState(0),[paid,setPaid]=useState(null),[extraUsed,setExtraUsed]=useState(0),[modal,setModal]=useState(null),[history,setHistory]=useState([]),[showHistory,setShowHistory]=useState(false),[pressed,setPressed]=useState(null),[toast,setToast]=useState('');
      const limit=paid?paid.limit:FREE_LIMIT;
      const used=paid?extraUsed:uses;
      const remaining=Math.max(0,limit-used);
      const locked=remaining===0;
      const modalRef=useRef(modal);modalRef.current=modal;
      const closeModal=React.useCallback(()=>setModal(null),[]);
      useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),3500);return()=>clearTimeout(t);},[toast]);
      useEffect(()=>{if(!pressed)return;const t=setTimeout(()=>setPressed(null),110);return()=>clearTimeout(t);},[pressed]);
      function input(value){
        if(modalRef.current)return;
        if(locked){setModal('checkout');return;}
        setPressed(value);
        if(value==='clear'){setExpression('0');setLastExpression('');setError('');setFinished(false);return;}
        if(value==='backspace'){setExpression(expression.length>1?expression.slice(0,-1):'0');setError('');setFinished(false);return;}
        if(value==='='){
          if(finished&&!error)return;
          try{const result=calculate(expression);setLastExpression(pretty(expression)+' =');setExpression(result);setFinished(true);setError('');setHistory(h=>[{expression:pretty(expression),result:pretty(result),id:Date.now()},...h].slice(0,10));if(paid)setExtraUsed(n=>n+1);else setUses(n=>n+1);if(remaining===1)setModal('checkout');}
          catch(e){setError(e.message);}
          return;
        }
        setError('');
        if(value==='sign'){
          try{if(finished){setExpression(String(-Number(expression)));}else{const match=expression.match(/(\d*\.?\d+(?:e[+-]?\d+)?%?)$/i);if(match){const start=match.index;const prefix=expression.slice(0,start);setExpression(prefix+'(-'+match[0]+')');}else if(expression.endsWith(')'))setExpression('-('+expression+')');else setExpression(expression==='0'?'-':expression+'-');}}catch{setExpression('0');}setFinished(false);return;
        }
        let current=expression;
        if(finished){if(/[0-9.(]/.test(value)){current='0';setLastExpression('');}setFinished(false);}
        if(current.length>=64){setToast('64 characters. Even our generosity has limits.');return;}
        if(/^\d$/.test(value)){setExpression(current==='0'?value:current.endsWith(')')||current.endsWith('%')?current+'*'+value:current+value);return;}
        if(value==='.') {const segment=current.split(/[+\-*/()]/).pop();if(segment.includes('.')||segment.includes('e')||current.endsWith('%'))return;setExpression(current+(segment===''?'0.':'.'));return;}
        if(['+','-','*','/'].includes(value)){if(/[+*/-]$/.test(current)){if(value==='-'&&!current.endsWith('-'))setExpression(current+'-');else setExpression(current.replace(/[+*/-]+$/,value));}else setExpression(current+value);return;}
        if(value==='%'){if(/[\d)]$/.test(current))setExpression(current+'%');return;}
        if(value==='('){setExpression(current==='0'?'(':current+(/[\d)%]$/.test(current)?'*(':'('));return;}
        if(value===')'){const opens=(current.match(/\(/g)||[]).length,closes=(current.match(/\)/g)||[]).length;if(opens>closes&&/[\d)%]$/.test(current))setExpression(current+')');}
      }
      useEffect(()=>{const handle=e=>{if(modalRef.current||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.target.tagName==='BUTTON'&&(e.key===' '||(e.key==='Enter'&&!e.target.closest('.keypad'))))return;let key=e.key;if(key==='Enter'||key==='=')key='=';else if(key==='Escape'||key==='Delete'||key.toLowerCase()==='c')key='clear';else if(key==='Backspace')key='backspace';else if(key.toLowerCase()==='x')key='*';else if(!/^[0-9.+\-*/%()]$/.test(key))return;e.preventDefault();input(key);};window.addEventListener('keydown',handle);return()=>window.removeEventListener('keydown',handle);},[expression,locked,finished,error]);
      const complete=tier=>{if(paid&&RANK[tier.id]<=RANK[paid.id]){setModal(null);setToast('You already have '+paid.name+'.');return;}setPaid(tier);setExtraUsed(0);setModal(null);setToast(fmtLimit(tier.limit)+' calculations unlocked.');};
      const openCheckout=()=>setModal('checkout');
      const pct=Math.round(remaining/limit*100);
      return html`<div className="site"><header><a href="#" className="brand" aria-label="sum. home" onClick=${e=>e.preventDefault()}><${Logo}/><span className="wordmark">sum.</span></a><button className="nav-upgrade" onClick=${openCheckout}>Upgrade</button></header>
      <main>
      <div className="workspace"><div className="calculator-wrap"><section className="calculator" id="calculator" aria-label="Calculator" tabIndex="-1"><div className="calc-top"><span className="calc-label"><${Icon} name="calc" size=${13}/> STANDARD</span><div className="plan-meter"><span className="plan-pill"><span className="tiny-dot" style=${{width:'3px',height:'3px'}}></span>${paid?paid.name.toUpperCase():'FREE PLAN'}<b>${remaining}/${limit}</b></span><span className="mini-meter" role="progressbar" aria-label=${remaining+' of '+limit+' remaining'}><i style=${{width:pct+'%'}}></i></span></div></div><div className="display"><div className="display-top"><span>${locked?'LIMIT REACHED':''}</span><span className="history-expr">${lastExpression.length>23?'\u2026'+lastExpression.slice(-22):lastExpression}</span></div><div className=${'display-number'+(expression.length>11?' small':'')+(error?' error':'')} aria-live="polite" aria-atomic="true">${error?html`<span title=${error}>${error.includes('zero')?'Nice try.':error.includes('big')?'Too ambitious.':'Not quite.'}</span>`:pretty(expression)}</div>${error&&html`<span style=${{fontSize:'9px',color:'#c18f7c',display:'block',marginTop:'-4px',marginBottom:'3px'}} role="alert">${error}</span>`}</div><div className="keypad">${KEY_LAYOUT.map(([label,value,cls,aria])=>html`<button key=${value} className=${'key '+cls+(pressed===value?' pressed':'')} onClick=${()=>input(value)} aria-label=${aria} aria-disabled=${locked} title=${locked?'Trial complete \u2014 choose a mock plan':aria}>${label}</button>`)}</div>${locked&&html`<button className="usage-ended" onClick=${openCheckout} style=${{margin:'15px auto 0'}}>Upgrade to continue <${Icon} name="arrow" size=${13}/></button>`}</section></div>
      <aside className="sidebar">${history.length>0&&html`<div className="history-panel"><div className="section-kicker"><button onClick=${()=>setShowHistory(v=>!v)} style=${{display:'flex',alignItems:'center',gap:'6px'}}><${Icon} name="history" size=${12}/> RECENT MATH ${showHistory?'\u2212':'+'}</button>${showHistory&&html`<button onClick=${()=>{setHistory([]);setShowHistory(false);}}>Clear</button>`}</div>${showHistory&&history.map(item=>html`<div className="history-row" key=${item.id}><span>${item.expression.length>25?item.expression.slice(0,25)+'\u2026':item.expression}</span><strong>= ${item.result}</strong></div>`)}</div>`}</aside></div></main>
      ${modal==='checkout'&&html`<${Checkout} locked=${locked} current=${paid} onClose=${closeModal} onComplete=${complete}/>`}
      ${toast&&html`<div className="toast" role="status">${toast}</div>`}</div>`;
    }
    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
