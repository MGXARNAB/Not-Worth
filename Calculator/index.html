        if(value===')'){const opens=(current.match(/\(/g)||[]).length,closes=(current.match(/\)/g)||[]).length;if(opens>closes&&/[\d)%]$/.test(current))setExpression(current+')');}
      }
      useEffect(()=>{const handle=e=>{if(!started||modalRef.current||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.target.tagName==='BUTTON'&&(e.key===' '||(e.key==='Enter'&&!e.target.closest('.keypad'))))return;let key=e.key;if(key==='Enter'||key==='=')key='=';else if(key==='Escape'||key==='Delete'||key.toLowerCase()==='c')key='clear';else if(key==='Backspace')key='backspace';else if(key.toLowerCase()==='x')key='*';else if(!/^[0-9.+\-*/%()]$/.test(key))return;e.preventDefault();input(key);};window.addEventListener('keydown',handle);return()=>window.removeEventListener('keydown',handle);});
      const complete=tier=>{setPaid(tier);setExtraUsed(0);setModal(null);setToast(tier.id==='basic'?'10 calculations unlocked.':'Unlimited calculations unlocked.');};
      const openCheckout=()=>setModal('checkout');
      if(!started)return html`<div className="site" style=${{display:'grid',placeItems:'center',padding:'24px'}}><main style=${{width:'100%',maxWidth:'470px',padding:0}}><section className="calculator" style=${{padding:'36px'}} aria-labelledby="welcome-title"><div className="brand" style=${{marginBottom:'35px'}}><${Logo}/><span className="wordmark">sum.</span></div><div className="section-kicker" style=${{marginBottom:'13px'}}>BEFORE YOU START</div><h1 id="welcome-title" style=${{fontSize:'32px',letterSpacing:'-1px',fontWeight:500,margin:'0 0 16px'}}>Real math. A fictional checkout.</h1><p className="modal-description" style=${{fontSize:'13px',marginBottom:'13px'}}>This is a satirical calculator demo. All plans, prices, and receipts are fictional. No payment is processed or subscription created.</p><p className="modal-description" style=${{fontSize:'13px',marginBottom:'28px'}}>Use made-up details only. Entries stay in this page’s memory and reset on refresh. External libraries and fonts load from CDNs.</p><button className="primary" onClick=${()=>{setStarted(true);requestAnimationFrame(()=>document.getElementById('calculator')?.focus());}}>I understand · Start calculating <${Icon} name="arrow" size=${16}/></button></section></main></div>`;
      return html`<div className="site"><header><a href="#" className="brand" aria-label="sum. home" onClick=${e=>{e.preventDefault();setModal(null);window.scrollTo({top:0,behavior:'smooth'});}}><${Logo}/><span className="wordmark">sum.</span><span className="brand-tag">MATH, MONETIZED.</span></a><nav className="nav" aria-label="Main navigation"><button className="nav-btn active" onClick=${()=>{setModal(null);document.getElementById('calculator')?.scrollIntoView({behavior:'smooth',block:'center'});}}>Calculator</button><button className="nav-btn" onClick=${openCheckout}>Pricing</button></nav><button className="nav-upgrade" onClick=${openCheckout}><${Icon} name="bolt" size=${13}/><span>${paid?'Your plan':'Go premium'}</span></button></header>
      <main><section className="hero"><div className="eyebrow"><span className="tiny-dot"></span> BASIC ARITHMETIC. EXTRAORDINARY AMBITION.</div><h1>Big math. Small print<span>.</span></h1><p>The calculator you didn’t know you needed a subscription for.<br/><span>Three calculations on us.</span> Then it gets interesting.</p></section>
      <div className="workspace"><div className="calculator-wrap"><section className="calculator" id="calculator" aria-label="Calculator" tabIndex="-1"><div className="calc-top"><span className="calc-label"><${Icon} name="calc" size=${13}/> STANDARD</span><span className="plan-pill"><span className="tiny-dot" style=${{width:'3px',height:'3px'}}></span>${paid?paid.name.toUpperCase():'FREE PLAN'}</span></div><div className="display"><div className="display-top"><span>${locked?'MATH IS ON PAUSE':finished?'THE NUMBERS DON’T LIE':'LET’S MAKE SOME NUMBERS'}</span><span className="history-expr">${lastExpression.length>23?'…'+lastExpression.slice(-22):lastExpression}</span></div><div className=${'display-number'+(expression.length>11?' small':'')+(error?' error':'')} aria-live="polite" aria-atomic="true">${error?html`<span title=${error}>${error.includes('zero')?'Nice try.':error.includes('big')?'Too ambitious.':'Not quite.'}</span>`:pretty(expression)}</div>${error&&html`<span style=${{fontSize:'9px',color:'#c18f7c',display:'block',marginTop:'-4px',marginBottom:'3px'}} role="alert">${error}</span>`}</div><div className="keypad">${KEY_LAYOUT.map(([label,value,cls,aria])=>html`<button key=${value} className=${'key '+cls+(pressed===value?' pressed':'')} onClick=${()=>input(value)} aria-label=${aria} aria-disabled=${locked} title=${locked?'Trial complete — choose a mock plan':aria}>${label}</button>`)}</div><div className="calc-bottom"><span><span className="status-dot"></span>${locked?'Awaiting a questionable decision':'All systems adding up'}</span><span>v. 1.0.3</span></div></section><div className="keyboard-hint"><button onClick=${()=>setModal('keyboard')}><${Icon} name="keyboard" size=${14}/> Your keyboard works here, too. <kbd>↵</kbd> to calculate</button></div></div>
      <aside className="sidebar"><section className="usage-card"><div className="section-kicker"><${Icon} name=${paid?'sparkle':'bolt'} size=${12}/>${paid?'YOUR UPGRADED MATH':'A LITTLE MATH, ON THE HOUSE'}</div><div className="usage-heading"><div className="usage-number">${remaining===Infinity?'∞':String(remaining).padStart(2,'0')}<span>${limit===Infinity?'':' / '+String(limit).padStart(2,'0')}</span></div><div className="usage-description">${paid?'premium calculations':'free calculations'}<br/>${remaining===Infinity?'without limits':'remaining'}</div></div><div className="usage-bars" aria-label=${remaining===Infinity?'Unlimited calculations':remaining+' of '+limit+' calculations remaining'}>${Array.from({length:paid&&paid.id==='basic'?10:3},(_,i)=>html`<span key=${i} className=${i>=remaining?'used':''}></span>`)}</div><p className="usage-copy">${locked?html`<strong>You’ve officially out-mathed the free plan.</strong>`:paid?html`<span>Same numbers. A fancier label.<br/><strong>Look at you, investing in yourself.</strong></span>`:html`<span>Make them count. Literally.<br/>After that, we should talk about <strong>us.</strong></span>`}</p>${locked&&html`<button className="usage-ended" onClick=${openCheckout}>Unlock more questionable value <${Icon} name="arrow" size=${13}/></button>`}</section><section className="side-note"><h2>Some things in life are free.<br/><span>This is almost one of them.</span></h2><p>We took something your phone already does and added a business model. You’re welcome.</p></section><div className="benefits"><div className="benefit"><${Icon} name="check" size=${15}/>Unnecessarily beautiful. Actually functional.</div><div className="benefit"><${Icon} name="shield" size=${15}/>Standard operations. Full keyboard support.</div><div className="benefit"><${Icon} name="heart" size=${15}/>Built with love. And revenue projections.</div></div><button className="little-link" onClick=${openCheckout}>Meet your future subscription <${Icon} name="arrow" size=${14}/></button>${history.length>0&&html`<div className="history-panel"><div className="section-kicker"><button onClick=${()=>setShowHistory(v=>!v)} style=${{display:'flex',alignItems:'center',gap:'6px'}}><${Icon} name="history" size=${12}/> RECENT MATH ${showHistory?'−':'+'}</button>${showHistory&&html`<button onClick=${()=>{setHistory([]);setShowHistory(false);}}>Clear</button>`}</div>${showHistory&&history.map(item=>html`<div className="history-row" key=${item.id}><span>${item.expression.length>25?item.expression.slice(0,25)+'…':item.expression}</span><strong>= ${item.result}</strong></div>`)}</div>`}</aside></div></main>
      <footer><div className="footer-right" style=${{width:'100%',justifyContent:'space-between'}}><button onClick=${()=>setStarted(false)}>Disclaimer</button><span className="built">© ${new Date().getFullYear()} SUM.</span></div></footer>
      ${modal==='checkout'&&html`<${Checkout} locked=${locked} onClose=${closeModal} onComplete=${complete}/>`}
      ${modal==='keyboard'&&html`<${Dialog} narrow onClose=${closeModal} label="Keyboard shortcuts"><div className="modal-icon"><${Icon} name="keyboard" size=${22}/></div><div className="modal-intro"><h2>Keyboard shortcuts</h2></div><div className="shortcuts">${[['Numbers','0 – 9'],['Calculate','Enter / ='],['Add / subtract','+ / −'],['Multiply','* / X'],['Divide','/'],['Percentage','%'],['Decimal','.'],['Parentheses','( )'],['Delete a digit','⌫'],['Clear all','Esc / C'],['Also clear','Delete'],['Close dialog','Esc']].map(([label,key])=>html`<div className="shortcut" key=${label}><span>${label}</span><kbd>${key}</kbd></div>`)}</div><p className="fine-print">Standard order of operations. Percent divides by 100.</p><button className="primary" style=${{marginTop:'21px'}} onClick=${closeModal}>Done</button></${Dialog}>`}
      ${toast&&html`<div className="toast" role="status">${toast}</div>`}</div>`;
    }
    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
</html>
